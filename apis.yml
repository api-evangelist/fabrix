name: Fabrix
description: 'Fabrix (Fabrix Security) is an AI-native identity and access management
  company building AI agents for identity security. Its platform centers on the Identity
  Knowledge Graph, which unifies fragmented human, machine, and AI-agent identities
  across providers, and a set of AI agents that automate identity visibility and intelligence,
  user access reviews, just-in-time privileged access, identity lifecycle management,
  identity security posture management (ISPM), and non-human / AI-agent governance.
  Deployed as an agentless solution, Fabrix uses cross-provider identity resolution
  (deterministic matching, heuristics, and AI) plus natural-language analysis to speed
  access reviews, risk scoring, and compliance. Founded as a venture-backed startup
  (Norwest Venture Partners, Merlin, Jibe) and ISO 27001 aligned, Fabrix announced
  it is joining Silverfort in 2026 to build a runtime identity security platform.
  This profile currently tracks the company and its public web surface; Fabrix does
  not publish a public developer API, OpenAPI, or API reference.'
